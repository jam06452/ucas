services:
  ucas-db:
    image: postgres:17
    container_name: ucas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucas_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ucas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ucas_pgdata:
    driver: local
